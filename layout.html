<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{statement}}">
  <title>BIRL — {{lab}}</title>
  <link rel="stylesheet" href="{{base}}style.css">
  <script src="{{base}}script.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">{{skip}}</a>
  <header class="header wrap">
    <a class="logo" href="#home">BIRL</a>
    <nav aria-label="{{navigation}}">{{nav}}</nav>
    <div class="languages" aria-label="{{language}}">{{languages}}</div>
  </header>
  <main id="main" class="wrap">
    <div class="opening" id="home">
      <h1>{{lab}}</h1>
      <p class="affiliations">{{affiliations}}</p>
      <p class="statement">{{statement}}</p>
    </div>
    {{sections}}
  </main>
  <footer class="wrap">{{lab}}</footer>
</body>
</html>
